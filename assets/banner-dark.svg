<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="safak@senal:~$ whoami — terminal profile banner (dark)">

  <!-- ─── Background ─────────────────────────────────────────────────── -->
  <rect width="880" height="200" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- ─── Title bar ──────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="880" height="28" rx="10" ry="10" fill="#1c2128"/>
  <rect x="0" y="18" width="880" height="10" fill="#1c2128"/>

  <!-- Mac-style window dots -->
  <circle cx="18"  cy="14" r="6" fill="#ff5f56"/>
  <circle cx="40"  cy="14" r="6" fill="#ffbd2e"/>
  <circle cx="62"  cy="14" r="6" fill="#27c93f"/>

  <!-- Title centered -->
  <text x="440" y="19" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="13" font-weight="500" fill="#8b949e" text-anchor="middle"
        letter-spacing="0.6">safak@senal — bash — 80×24</text>

  <!-- ─── Terminal body ──────────────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">

    <!-- Line 1: prompt -->
    <text x="24" y="58" fill="#ffa657" font-weight="700">safak@senal</text>
    <text x="135" y="58" fill="#8b949e">:</text>
    <text x="146" y="58" fill="#a371f7">~</text>
    <text x="161" y="58" fill="#8b949e">$</text>
    <text x="178" y="58" fill="#f0f6fc" font-weight="600">whoami</text>

    <!-- Line 2: name -->
    <text x="40" y="86" fill="#8b949e">→</text>
    <text x="62" y="86" fill="#c9d1d9">name</text>
    <text x="120" y="86" fill="#8b949e">:</text>
    <text x="135" y="86" fill="#7ee787" font-weight="700">Sağak Şenal</text>

    <!-- Line 3: role -->
    <text x="40" y="108" fill="#8b949e">→</text>
    <text x="62" y="108" fill="#c9d1d9">role</text>
    <text x="120" y="108" fill="#8b949e">:</text>
    <text x="135" y="108" fill="#a371f7" font-weight="600">Fullstack Developer</text>

    <!-- Line 4: stack (compact) -->
    <text x="40" y="130" fill="#8b949e">→</text>
    <text x="62" y="130" fill="#c9d1d9">stack</text>
    <text x="120" y="130" fill="#8b949e">:</text>
    <text x="135" y="130" fill="#c9d1d9">React · Next.js · Node · RN · Flutter · API</text>

    <!-- Line 5: location -->
    <text x="40" y="152" fill="#8b949e">→</text>
    <text x="62" y="152" fill="#c9d1d9">loc</text>
    <text x="120" y="152" fill="#8b949e">:</text>
    <text x="135" y="152" fill="#c9d1d9">Türkiye 🇹🇷 · UTC+3</text>

    <!-- Line 6: live prompt with blinking cursor -->
    <text x="24" y="180" fill="#ffa657" font-weight="700">safak@senal</text>
    <text x="135" y="180" fill="#8b949e">:</text>
    <text x="146" y="180" fill="#a371f7">~</text>
    <text x="161" y="180" fill="#8b949e">$</text>
    <!-- Blinking cursor -->
    <rect x="178" y="168" width="9" height="16" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>

  </g>

  <!-- ─── Subtle scan-line texture (CRT vibe, çok hafif) ────────────── -->
  <defs>
    <pattern id="scandark" x="0" y="0" width="880" height="4" patternUnits="userSpaceOnUse">
      <rect width="880" height="2" fill="#a371f7" opacity="0.015"/>
    </pattern>
  </defs>
  <rect width="880" height="200" rx="10" ry="10" fill="url(#scandark)"/>

</svg>
