<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="title">
  <title>Tavriko | Gerçek zamanlı bilgi yarışması</title>
  <style>
    .sans {font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono {font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;letter-spacing:1.2px}
    @media (prefers-reduced-motion: no-preference) {
      .orbit {animation:trace 4.7s ease-in-out 1}
      .ping {animation:ping 4.7s ease-out 1}
      .answer {animation:answer 4.3s ease-in-out 1}
    }
    @keyframes trace {
      0% {opacity:0;stroke-dashoffset:110}
      16%, 79% {opacity:1}
      100% {opacity:0;stroke-dashoffset:-460}
    }
    @keyframes ping {
      0%, 17%, 100% {opacity:0;r:6px}
      27% {opacity:.8;r:6px}
      52%, 73% {opacity:0;r:15px}
      79% {opacity:.65;r:6px}
    }
    @keyframes answer {
      0%, 14%, 100% {opacity:0}
      45%, 77% {opacity:1}
    }
  </style>
  <defs>
    <clipPath id="bounds"><rect width="960" height="176" rx="26"/></clipPath>
    <linearGradient id="glass" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#faf8ff"/><stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".79" cy=".5" r=".52">
      <stop stop-color="#d8c7ff" stop-opacity=".9"/><stop offset="1" stop-color="#d8c7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ccc2e3" opacity=".54"/>
    </pattern>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="960" height="176" fill="url(#glass)"/>
    <rect width="960" height="176" fill="url(#bloom)"/>
    <rect width="960" height="176" fill="url(#dots)"/>
    <rect x="42" y="36" width="9" height="9" rx="2" fill="#11694f"/>
    <text x="63" y="45" class="mono" font-size="13" fill="#52466f">PROJE 01 / CANLI</text>
    <text x="42" y="108" class="sans" font-size="57" font-weight="800" letter-spacing="-2.5" fill="#211738">Tavriko</text>
    <text x="44" y="144" class="sans" font-size="21" fill="#52466f">Gerçek zamanlı bilgi yarışması</text>
    <g transform="translate(586 26)">
      <rect width="326" height="124" rx="21" fill="#f8f5ff" stroke="#ccc2e3"/>
      <text x="22" y="32" class="mono" font-size="13" fill="#52466f">HIZLI EŞLEŞME</text>
      <path d="M23 49h280" stroke="#ccc2e3" stroke-width="3" stroke-linecap="round"/>
      <path d="M23 49h192" stroke="#6340b4" stroke-width="3" stroke-linecap="round"/>
      <g fill="#ebe1ff" stroke="#ccc2e3">
        <rect x="22" y="66" width="63" height="39" rx="9"/>
        <rect x="168" y="66" width="63" height="39" rx="9"/>
        <rect x="241" y="66" width="63" height="39" rx="9"/>
      </g>
      <rect x="95" y="66" width="63" height="39" rx="9" fill="#ebe1ff" stroke="#11694f"/>
      <rect class="answer" x="95" y="66" width="63" height="39" rx="9" fill="none" stroke="#11694f" stroke-width="3" opacity="0"/>
      <g class="mono" font-size="15" fill="#52466f" text-anchor="middle">
        <text x="54" y="91">A</text>
        <text x="127" y="91" fill="#11694f">B</text>
        <text x="200" y="91">C</text>
        <text x="273" y="91">D</text>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="958.5" height="174.5" rx="25.25" fill="none" stroke="#ccc2e3" stroke-width="1.5"/>
</svg>
