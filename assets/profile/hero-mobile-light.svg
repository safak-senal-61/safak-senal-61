<svg xmlns="http://www.w3.org/2000/svg" width="450" height="425" viewBox="0 0 450 425" role="img" aria-labelledby="title">
  <title>Şafak Şenal | Fullstack ve Mobil Geliştirici</title>
  <style>
    .sans {font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono {font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;letter-spacing:1.2px}
    @media (prefers-reduced-motion: no-preference) {
      .orbit {animation:trace 4.7s ease-in-out 1}
      .ping {animation:ping 4.7s ease-out 1}
      .answer {animation:answer 4.3s ease-in-out 1}
    }
    @keyframes trace {
      0% {opacity:0;stroke-dashoffset:110}
      16%, 79% {opacity:1}
      100% {opacity:0;stroke-dashoffset:-460}
    }
    @keyframes ping {
      0%, 17%, 100% {opacity:0;r:6px}
      27% {opacity:.8;r:6px}
      52%, 73% {opacity:0;r:15px}
      79% {opacity:.65;r:6px}
    }
    @keyframes answer {
      0%, 14%, 100% {opacity:0}
      45%, 77% {opacity:1}
    }
  </style>
  <defs>
    <clipPath id="bounds"><rect width="450" height="425" rx="26"/></clipPath>
    <linearGradient id="glass" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#faf8ff"/><stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".72" cy=".68" r=".52">
      <stop stop-color="#d8c7ff" stop-opacity=".9"/><stop offset="1" stop-color="#d8c7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ccc2e3" opacity=".54"/>
    </pattern>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="450" height="425" fill="url(#glass)"/>
    <rect width="450" height="425" fill="url(#bloom)"/>
    <rect width="450" height="425" fill="url(#dots)"/>
    <path d="M24 64 H426" stroke="#ccc2e3"/>
    <rect x="24" y="33" width="9" height="9" rx="2" fill="#11694f"/>
    <text x="42" y="42" class="mono" fill="#52466f" font-size="13">GELİŞTİRİCİ PROFİLİ</text>
    <text x="426" y="42" text-anchor="end" class="mono" fill="#52466f" font-size="13">@safak-senal-61</text>
    <text x="24" y="128" class="sans" fill="#211738" font-weight="800" font-size="57" letter-spacing="-2.9">Şafak Şenal<tspan fill="#6340b4">.</tspan></text>
    <text x="24" y="165" class="sans" fill="#52466f" font-size="25">Fullstack &amp; Mobil Geliştirici</text>
    <g transform="translate(67 184)">
      <path d="M22 117h272M158 14v206" stroke="#ccc2e3" stroke-dasharray="2 6" fill="none"/>
      <circle cx="158" cy="117" r="105" fill="none" stroke="#ccc2e3"/>
      <circle cx="158" cy="117" r="88" fill="#f8f5ff" fill-opacity=".55" stroke="#ccc2e3" stroke-dasharray="2 5"/>
      <circle cx="158" cy="117" r="88" class="orbit" fill="none" stroke="#6340b4" stroke-width="3"
              stroke-dasharray="32 521" stroke-linecap="round" opacity="0" transform="rotate(-90 158 117)"/>
      <path d="M158 29v55m0 65v56m-70-44 40-26m60 0 40 26" stroke="#6340b4" stroke-opacity=".6" fill="none"/>
      <circle cx="158" cy="29" r="5" fill="#11694f"/>
      <circle cx="88" cy="161" r="5" fill="#6340b4"/>
      <circle cx="228" cy="161" r="5" fill="#11694f"/>
      <circle cx="158" cy="29" r="7" class="ping" fill="none" stroke="#11694f" stroke-width="2" opacity="0"/>
      <circle cx="228" cy="161" r="7" class="ping" fill="none" stroke="#11694f" stroke-width="2" opacity="0"/>
      <path d="M153 12h10m-5-5v10m-5 205h10m-5-5v10m-110-110h10m-5-5v10m205-5h10m-5-5v10"
            stroke="#6340b4" stroke-linecap="round" fill="none"/>
      <rect x="116" y="84" width="84" height="65" rx="17" fill="#f8f5ff" stroke="#6340b4" stroke-width="1.4"/>
      <path d="m143 110-9 7 9 7m30-14 9 7-9 7m-11-21-8 28"
            stroke="#6340b4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <g class="mono" font-size="12" fill="#52466f">
        <text x="177" y="34">WEB</text>
        <text x="24" y="166">MOBİL</text>
        <text x="243" y="166">API</text>
      </g>
      <circle cx="48" cy="61" r="2" fill="#6340b4" opacity=".8"/>
      <circle cx="265" cy="69" r="2" fill="#11694f" opacity=".8"/>
      <circle cx="246" cy="207" r="2" fill="#6340b4" opacity=".8"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="448.5" height="423.5" rx="25.25" fill="none" stroke="#ccc2e3" stroke-width="1.5"/>
</svg>
